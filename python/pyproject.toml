[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "biigletools"
version = "0.0.1"
description = "Helper functions for the BIIGLE API (Python port of the R package)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["requests>=2.28", "pandas>=1.5"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Npiechaud/biigletools"

[tool.setuptools]
packages = ["biigletools"]
